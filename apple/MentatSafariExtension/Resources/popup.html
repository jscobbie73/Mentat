<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mentat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      width: 320px;
      padding: 16px;
      background: #fafafa;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .btn:hover { background: #f0f0f0; }
    .btn-primary {
      background: #007AFF;
      color: white;
      border-color: #007AFF;
    }
    .btn-primary:hover { background: #0066DD; }
    .status {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 12px;
    }
    .status.success { color: #34C759; }
    .status.error { color: #FF3B30; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Mentat</h1>
  </div>
  <button class="btn btn-primary" id="save-page">Save This Page</button>
  <button class="btn" id="save-selection">Save Selection</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
